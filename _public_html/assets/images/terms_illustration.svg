<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  
  <!-- Background Glow & Card Base -->
  <rect x="50" y="40" width="500" height="420" rx="24" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="90" y="80" width="420" height="340" rx="16" fill="#ffffff" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.05))"/>

  <!-- Document Header -->
  <circle cx="130" cy="120" r="22" fill="url(#grad1)"/>
  <path d="M123 120 L128 125 L138 115" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <rect x="170" y="110" width="160" height="14" rx="7" fill="#1e293b"/>
  <rect x="170" y="130" width="100" height="10" rx="5" fill="#94a3b8"/>
  
  <!-- Security Shield Badge -->
  <g transform="translate(440, 95)">
    <circle cx="25" cy="25" r="25" fill="#ecfdf5"/>
    <path d="M25 12 L37 17 V26 C37 34 25 40 25 40 C25 40 13 34 13 26 V17 Z" fill="#10b981"/>
    <path d="M21 26 L24 29 L30 23" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Contract Lines -->
  <rect x="130" y="175" width="340" height="12" rx="6" fill="#e2e8f0"/>
  <rect x="130" y="200" width="300" height="12" rx="6" fill="#e2e8f0"/>
  <rect x="130" y="225" width="320" height="12" rx="6" fill="#e2e8f0"/>

  <rect x="130" y="260" width="280" height="12" rx="6" fill="#cbd5e1"/>
  <rect x="130" y="285" width="340" height="12" rx="6" fill="#cbd5e1"/>

  <!-- Signature Stamp Box -->
  <rect x="130" y="325" width="150" height="60" rx="8" fill="url(#grad2)" stroke="#818cf8" stroke-dasharray="4"/>
  <path d="M145 365 Q160 345 180 360 T220 350 T260 365" stroke="#6366f1" stroke-width="3" fill="none"/>
  
  <!-- Verified Badge -->
  <g transform="translate(340, 325)">
    <rect x="0" y="0" width="130" height="40" rx="20" fill="url(#grad1)"/>
    <text x="65" y="25" fill="#ffffff" font-size="13" font-family="sans-serif" font-weight="bold" text-anchor="middle">100% Verified</text>
  </g>
</svg>
