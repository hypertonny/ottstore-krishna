name: OTT Store CI/CD (Build & Deploy)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Lint & Code Integrity Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, curl, gd, mbstring, zip

      - name: Validate PHP Syntax Across Project
        run: |
          echo "Validating syntax across all PHP scripts..."
          find _public_html -type f -name "*.php" -exec php -l {} \;

  deploy:
    name: Automated Docker Build & Start
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Pull and Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/ott-store
            git fetch origin main
            git reset --hard origin/main
            docker compose down --remove-orphans || true
            docker compose up -d --build
            echo "Waiting for services to become healthy..."
            for i in {1..15}; do
                STATUS=$(docker inspect --format='{{.State.Health.Status}}' ott_web 2>/dev/null || echo "starting")
                echo "Health check attempt $i: $STATUS"
                if [ "$STATUS" == "healthy" ]; then
                    echo "Deployment is HEALTHY and OPERATIONAL!"
                    break
                fi
                sleep 2
            done
            docker compose ps
