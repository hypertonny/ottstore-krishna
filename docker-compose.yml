services:
  db:
    image: mysql:8.0
    container_name: ott_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: "SuperSecureRootPassword2026!"
      MYSQL_DATABASE: "u168620846_ott"
      MYSQL_USER: "u168620846_ott"
      MYSQL_PASSWORD: "4uQ3=1+v>&"
    volumes:
      - ott_db_data:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - ott_internal
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -pSuperSecureRootPassword2026! || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ott_web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DB_HOST: "db"
      DB_NAME: "u168620846_ott"
      DB_USER: "u168620846_ott"
      DB_PASS: "4uQ3=1+v>&"
    volumes:
      - ./_public_html:/var/www/html
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ott_internal
    healthcheck:
      test: ["CMD-SHELL", "curl -f -k https://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ott_db_data:

networks:
  ott_internal:
    driver: bridge
